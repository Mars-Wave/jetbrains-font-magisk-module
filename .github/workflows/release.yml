name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: zip -r magisk-jetbrains-mono-system-font.zip META-INF module.prop system
      - run: gh release create "$GITHUB_REF_NAME" magisk-jetbrains-mono-system-font.zip --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
